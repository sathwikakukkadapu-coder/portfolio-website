<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 640" width="100%" height="100%" style="background:#ffffff; font-family: Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="glowTeal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0D9488" flood-opacity="0.18"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0D9488"/>
    </marker>
    <marker id="arrowFeedback" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Canvas Border -->
  <rect x="10" y="10" width="1300" height="620" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Title Banner -->
  <g transform="translate(30, 28)">
    <rect x="0" y="0" width="4" height="42" fill="#0D9488" rx="2"/>
    <text x="14" y="20" font-size="11" font-weight="800" fill="#0D9488" letter-spacing="1.2">APAARNET TECHNICAL ARCHITECTURE • SMART EDUCATION PIPELINE</text>
    <text x="14" y="38" font-size="19" font-weight="900" fill="#0F172A">Student-Level Identity Verification & Statutory Quota Auditing Engine</text>
    
    <!-- Legend on Top Right -->
    <g transform="translate(860, 4)">
      <rect x="0" y="0" width="390" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="18" cy="17" r="5" fill="#0D9488"/>
      <text x="28" y="21" font-size="10.5" font-weight="700" fill="#0F766E">Automated Validation</text>
      
      <circle cx="160" cy="17" r="5" fill="#D97706"/>
      <text x="170" y="21" font-size="10.5" font-weight="700" fill="#B45309">Human Decision Required</text>
      
      <circle cx="318" cy="17" r="5" fill="#7C3AED"/>
      <text x="328" y="21" font-size="10.5" font-weight="700" fill="#6D28D9">Audit Ledger</text>
    </g>
  </g>

  <!-- Horizontal Flow Connector Line Behind Cards -->
  <line x1="180" y1="280" x2="1140" y2="280" stroke="#CCFBF1" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- ==================== STAGE 1: DATA INGESTION ==================== -->
  <g transform="translate(30, 95)">
    <rect width="186" height="370" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="186" height="38" rx="14" fill="#0F172A"/>
    <rect y="24" width="186" height="14" fill="#0F172A"/>
    <text x="14" y="24" font-size="11" font-weight="800" fill="#38BDF8" letter-spacing="0.8">STAGE 1</text>
    <text x="66" y="24" font-size="11" font-weight="800" fill="#FFFFFF">DATA INGESTION</text>

    <!-- Mode Badge -->
    <rect x="12" y="48" width="162" height="20" rx="4" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="93" y="62" font-size="9" font-weight="700" fill="#0F766E" text-anchor="middle">Input Exhibits & ERP Feeds</text>

    <!-- Sub-boxes -->
    <g transform="translate(12, 78)">
      <rect width="162" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="10" y="20" font-size="10" font-weight="700" fill="#0F172A">College ERP CSVs</text>
      <text x="10" y="36" font-size="8.5" fill="#64748B">Admitted rolls, quota flags</text>
      <text x="10" y="50" font-size="8.5" fill="#64748B">& program branch allocations</text>
    </g>

    <g transform="translate(12, 150)">
      <rect width="162" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="10" y="20" font-size="10" font-weight="700" fill="#0F172A">Excel Spreadsheets</text>
      <text x="10" y="36" font-size="8.5" fill="#64748B">Legacy registrar registries</text>
      <text x="10" y="50" font-size="8.5" fill="#64748B">& offline quota lists</text>
    </g>

    <g transform="translate(12, 222)">
      <rect width="162" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="10" y="20" font-size="10" font-weight="700" fill="#0F172A">Institutional Records</text>
      <text x="10" y="36" font-size="8.5" fill="#64748B">Candidate demographic profiles</text>
      <text x="10" y="50" font-size="8.5" fill="#64748B">& admission slips</text>
    </g>

    <!-- Stage Footer -->
    <rect x="12" y="300" width="162" height="54" rx="6" fill="#F1F5F9"/>
    <text x="20" y="320" font-size="8.5" font-weight="700" fill="#334155">• Multi-format intake</text>
    <text x="20" y="338" font-size="8.5" font-weight="700" fill="#334155">• Local client upload stream</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="222" y1="280" x2="246" y2="280" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ==================== STAGE 2: DATA STANDARDIZATION ==================== -->
  <g transform="translate(250, 95)">
    <rect width="186" height="370" rx="14" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.8" filter="url(#glowTeal)"/>
    <rect width="186" height="38" rx="14" fill="#0F766E"/>
    <rect y="24" width="186" height="14" fill="#0F766E"/>
    <text x="12" y="24" font-size="11" font-weight="800" fill="#99F6E4" letter-spacing="0.8">STAGE 2</text>
    <text x="62" y="24" font-size="11" font-weight="800" fill="#FFFFFF">STANDARDIZATION</text>

    <!-- Badge -->
    <rect x="12" y="48" width="162" height="20" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="93" y="62" font-size="9" font-weight="700" fill="#065F46" text-anchor="middle">Automated Normalization</text>

    <g transform="translate(12, 78)">
      <rect width="162" height="64" rx="8" fill="#F0FDFA" stroke="#CCFBF1"/>
      <text x="10" y="19" font-size="10" font-weight="700" fill="#0F766E">Automatic Schema Map</text>
      <text x="10" y="35" font-size="8.5" fill="#475569">Jaro-Winkler header matching</text>
      <text x="10" y="49" font-size="8.5" fill="#475569">(Resolves messy ERP aliases)</text>
    </g>

    <g transform="translate(12, 150)">
      <rect width="162" height="64" rx="8" fill="#F0FDFA" stroke="#CCFBF1"/>
      <text x="10" y="19" font-size="10" font-weight="700" fill="#0F766E">Schema Normalization</text>
      <text x="10" y="35" font-size="8.5" fill="#475569">Unified standard data model</text>
      <text x="10" y="49" font-size="8.5" fill="#475569">Type coercion & sanitization</text>
    </g>

    <g transform="translate(12, 222)">
      <rect width="162" height="64" rx="8" fill="#F0FDFA" stroke="#CCFBF1"/>
      <text x="10" y="19" font-size="10" font-weight="700" fill="#0F766E">Data Quality & Fields</text>
      <text x="10" y="35" font-size="8.5" fill="#475569">Mandatory field presence audit</text>
      <text x="10" y="49" font-size="8.5" fill="#475569">Null/blank detection rules</text>
    </g>

    <rect x="12" y="300" width="162" height="54" rx="6" fill="#F1F5F9"/>
    <text x="20" y="320" font-size="8.5" font-weight="700" fill="#334155">• Instant header alignment</text>
    <text x="20" y="338" font-size="8.5" font-weight="700" fill="#334155">• Zero manual translation</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="442" y1="280" x2="466" y2="280" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ==================== STAGE 3: IDENTITY VERIFICATION ==================== -->
  <g transform="translate(470, 95)">
    <rect width="186" height="370" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect width="186" height="38" rx="14" fill="#0F172A"/>
    <rect y="24" width="186" height="14" fill="#0F172A"/>
    <text x="10" y="24" font-size="11" font-weight="800" fill="#38BDF8" letter-spacing="0.8">STAGE 3</text>
    <text x="60" y="24" font-size="11" font-weight="800" fill="#FFFFFF">IDENTITY AUDIT</text>

