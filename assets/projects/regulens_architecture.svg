    <text x="93" y="62" font-size="9" font-weight="700" fill="#B45309" text-anchor="middle">Math Check + Human Triage</text>

    <g transform="translate(12, 78)">
      <rect width="162" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
